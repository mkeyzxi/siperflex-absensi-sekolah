<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SIPERFLEX</title>
    <style>
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F8FAFC;
            color: #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #1D4ED8; font-size: 2rem; margin-bottom: 0.5rem; }
        p { margin-bottom: 1.5rem; max-width: 400px; line-height: 1.5; }
        .icon { width: 100px; height: 100px; margin-bottom: 20px; opacity: 0.5; }
        .btn {
            background-color: #1D4ED8;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #1E40AF; }
    </style>
</head>
<body>
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <h1>Anda Sedang Offline</h1>
    <p>Koneksi internet Anda terputus. Jika Anda sudah pernah masuk sebelumnya, Anda bisa membuka Dashboard Mode Offline di bawah ini.</p>
    
    <div id="offline-links" style="display:flex; flex-direction:column; gap:10px; margin-top:10px; width:100%; max-width: 300px; margin-left:auto; margin-right:auto;">
        <a href="/" class="btn" style="background-color: #64748b;">Coba Muat Ulang</a>
    </div>

    <script>
        if ('caches' in window) {
            const linksDiv = document.getElementById('offline-links');
            
            caches.match('/siswa/dashboard', {ignoreSearch: true}).then(response => {
                if (response) {
                    const a = document.createElement('a');
                    a.href = '/siswa/dashboard';
                    a.className = 'btn';
                    a.style.backgroundColor = '#10B981'; 
                    a.textContent = '🚀 Buka Dashboard Siswa (Offline)';
                    linksDiv.insertBefore(a, linksDiv.firstChild);
                }
            });
            
            caches.match('/guru/dashboard', {ignoreSearch: true}).then(response => {
                if (response) {
                    const a = document.createElement('a');
                    a.href = '/guru/dashboard';
                    a.className = 'btn';
                    a.style.backgroundColor = '#10B981'; 
                    a.textContent = '🚀 Buka Dashboard Guru (Offline)';
                    linksDiv.insertBefore(a, linksDiv.firstChild);
                }
            });
        }
    </script>
</body>
</html>
